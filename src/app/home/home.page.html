
<ion-header>
  <ion-toolbar>
    <ion-title>Punto Escolar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Bienvenido a Punto Escolar</h1>

  <p>
    Has iniciado sesión correctamente.
  </p>

  <p>
    Próximamente podrás consultar
    y administrar los productos del inventario.
  </p>

  <ion-button expand="block" (click)="abrirInventario()">
    Ver inventario
  </ion-button>

  <ion-button
    expand="block"
    color="danger"
    fill="outline"
    (click)="cerrarSesion()">

    Cerrar sesión

  </ion-button>
  
  <ion-button
    expand="block"
    (click)="abrirTablero()">
    Ver tablero de inventario
  </ion-button>

</ion-content>
