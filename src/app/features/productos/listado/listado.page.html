
<ion-header>
  <ion-toolbar>
    <ion-title>Inventario</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="nuevoProducto()">
        Agregar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar
    placeholder="Buscar por nombre"
    [debounce]="300"
    (ionInput)="buscar($event)">
  </ion-searchbar>

  <div class="ion-text-center" *ngIf="cargando()">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-text color="danger" *ngIf="error()">
    <p>{{ error() }}</p>
  </ion-text>

  <p
    *ngIf="!cargando() && !error() && productos().length === 0"
    class="ion-text-center">
    No se encontraron productos.
  </p>

  <ion-card
    *ngFor="let producto of productos()"
    (click)="consultarProducto(producto)"
    [button]="true">

    <ion-card-header>
      <ion-card-title>
        {{ producto.nombre }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <p>
        Precio:
        {{ producto.precio_venta | currency:'MXN' }}
      </p>

      <p>
        Existencias:
        <strong>{{ producto.existencia }}</strong>
      </p>

      <p>
        Cantidad mínima:
        {{ producto.stock_minimo }}
      </p>

    </ion-card-content>
  </ion-card>

</ion-content>
