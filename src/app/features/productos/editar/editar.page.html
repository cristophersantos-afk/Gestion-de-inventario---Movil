
<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/productos">
      </ion-back-button>
    </ion-buttons>

    <ion-title>Editar producto</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="ion-text-center" *ngIf="cargando()">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando producto...</p>
  </div>

  <ion-text color="danger" *ngIf="error()">
    <p>{{ error() }}</p>
  </ion-text>

  <form
    *ngIf="!cargando() && producto()"
    (ngSubmit)="guardarCambios()">

    <ion-item>
      <ion-input
        label="Nombre *"
        labelPlacement="stacked"
        name="nombre"
        [(ngModel)]="formulario.nombre"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Precio de venta *"
        labelPlacement="stacked"
        name="precio"
        type="number"
        inputmode="decimal"
        min="0"
        [(ngModel)]="formulario.precio_venta"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Cantidad mínima *"
        labelPlacement="stacked"
        name="minimo"
        type="number"
        min="0"
        step="1"
        [(ngModel)]="formulario.stock_minimo"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Marca"
        labelPlacement="stacked"
        name="marca"
        [(ngModel)]="formulario.marca">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Categoría"
        labelPlacement="stacked"
        name="categoria"
        [(ngModel)]="formulario.categoria">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Descripción"
        labelPlacement="stacked"
        name="descripcion"
        [autoGrow]="true"
        [(ngModel)]="formulario.descripcion">
      </ion-textarea>
    </ion-item>

    <ion-item>
      <ion-input
        label="Existencias actuales"
        labelPlacement="stacked"
        type="number"
        [value]="producto()?.existencia"
        readonly>
      </ion-input>
    </ion-item>

    <p class="ion-padding-horizontal">
      <small>
        Las existencias solo pueden modificarse mediante
        movimientos de entrada o salida.
      </small>
    </p>

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="guardando()">

      <ion-spinner
        *ngIf="guardando()"
        name="crescent">
      </ion-spinner>

      <span *ngIf="!guardando()">
        Guardar cambios
      </span>

    </ion-button>

  </form>

</ion-content>
